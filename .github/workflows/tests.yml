name: Research and shadow regression tests

on:
  pull_request:
  push:
    branches:
      - codex/stock-research-and-shadow

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-research.txt
      - run: python -m pip install -r requirements.txt -r requirements-research.txt
      - run: python -m pytest tests -q
      - run: python -m trading.cli demo --output-dir .private_trading/ci_demo
