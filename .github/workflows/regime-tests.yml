name: Regime research tests

on:
  pull_request:
  push:
    branches: [codex/crypto-regime-study]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests -q
      - run: python -m analysis_2026.regimes --output /tmp/regime-smoke
